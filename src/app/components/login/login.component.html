<div class="login-page-container">
    <div class="login-container-wrapper">
        
        <div class="login-card">
            <h2 class="login-titulo-principal">¡Bienvenido de nuevo!</h2>
            <p class="login-subtitulo">Accedé a tu panel profesional.</p>
            
            <form (ngSubmit)="onLogin()" #loginForm="ngForm">
                
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control"
                        placeholder="ejemplo@correo.com"
                        [(ngModel)]="email" 
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control"
                        placeholder="********"
                        [(ngModel)]="password" 
                        required>
                </div>
                
                <div *ngIf="errorMessage" class="alerta-error">
                    {{ errorMessage }}
                </div>

                <button class="boton boton-primario" type="submit" [disabled]="!loginForm.valid">
                    Ingresar
                </button>
            </form>

           

            <div class="register-link">
                ¿No tenés cuenta? 
                <a routerLink="/registro" class="link-registro-cta">Registrate acá</a> 
            </div>
        </div>
        
        <div class="login-image-side">
            <img src="login.jpg" alt="Ilustración de bienvenida" class="login-image">
        </div>
    </div>
</div>
