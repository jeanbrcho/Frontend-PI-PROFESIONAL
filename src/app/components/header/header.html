<div class="header-wrapper">
  <div class="logo-section">
    <div class="brand">
      <img src="logo.png" alt="Logo" class="logo">
      <h1 class="brand-title">Guau que Corte</h1>


    </div>

     <ng-container *ngIf="authService.isLoggedIn(); else loginButton">
          <button class="menu-login-btn" (click)="logout(); closeMenu()">
            <span class="paw-icon">🐾</span> Cerrar sesión
          </button>
        </ng-container>

        <ng-template #loginButton>
          <a routerLink="/login" class="menu-login-btn" (click)="closeMenu()">
            <span class="paw-icon">🐾</span> Iniciar sesión
          </a>
        </ng-template>
  </div>


  

  <header [class.fixed]="isFixed" class="main-header">

   


    <button class="hamburger" [class.active]="menuOpen" (click)="toggleMenu()" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    
    <nav class="nav-links" [class.open]="menuOpen">
      <div class="menu-brand">
        <img src="logo.png" alt="Logo" class="menu-logo">
        <h2 class="menu-brand-title">Guau que Corte</h2>
      </div>
      
      <a [routerLink]="['/']" (click)="closeMenu()">Inicio</a>
      <a [routerLink]="['/planes']" (click)="closeMenu()">Planes</a>
      <a [routerLink]="['/panel']" (click)="closeMenu()">Mi Panel</a>
      
      <div class="menu-auth">
        <button class="menu-dark-mode-btn" (click)="toggleDarkMode()">
          <i *ngIf="!isDarkMode" class="fas fa-moon"></i>
          <i *ngIf="isDarkMode" class="fas fa-sun"></i>
          <span *ngIf="!isDarkMode">Modo Oscuro</span>
          <span *ngIf="isDarkMode">Modo Claro</span>
        </button>
        
        <ng-container *ngIf="authService.isLoggedIn(); else loginButton">
          <button class="menu-login-btn" (click)="logout(); closeMenu()">
            <span class="paw-icon">🐾</span> Cerrar sesión
          </button>
        </ng-container>

        <ng-template #loginButton>
          <a routerLink="/login" class="menu-login-btn" (click)="closeMenu()">
            <span class="paw-icon">🐾</span> Iniciar sesión
          </a>
        </ng-template>
      </div>
    </nav>
  </header>
</div>
