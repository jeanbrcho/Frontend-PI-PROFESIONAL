<div class="panel-content-card">
  <h2>👤 Mi Perfil</h2>




 <form *ngIf="isEditing" class="perfil-form" (ngSubmit)="guardarCambios()">

 <!--  profesionalDataDraft para evitar modificar los datos originales al editar. -->
 <div class="form-group">
   <label for="name">Nombre:</label>
 <input type="text" id="name" name="name" [(ngModel)]="profesionalDataDraft.name" [disabled]="!isEditing" required>
  </div>

  <div class="form-group">
 <label for="lastname">Apellido:</label>
 <input type="text" id="lastname" name="lastname" [(ngModel)]="profesionalDataDraft.lastname" [disabled]="!isEditing" required>
 </div>

  <div class="form-group">
   <label for="email">Email:</label>
   <!-- Email es solo lectura -->
   <input type="email" id="email" name="email" [(ngModel)]="profesionalDataDraft.email" [disabled]="!isEditing" required>
  </div>

  <div class="form-group">
   <label for="phone">Teléfono:</label>
   <input type="text" id="phone" name="phone" [(ngModel)]="profesionalDataDraft.phone" [disabled]="!isEditing" required>
  </div>

  <div class="form-group">
   <label for="dni">DNI:</label>
   <!-- DNI es solo lectura -->
   <input type="text" id="dni" name="dni" [(ngModel)]="profesionalDataDraft.dni" disabled class="input-disabled">
  </div>

  <div class="form-group">
   <label for="license">Licencia:</label>
   <!-- Licencia es solo lectura -->
   <input type="text" id="license" name="license" [(ngModel)]="profesionalDataDraft.license" disabled class="input-disabled">
  </div>

  <div class="action-buttons">
   
   <button type="submit" class="btn-guardar" [disabled]="isSaving">
    {{ isSaving ? 'Guardando...' : 'Guardar Cambios' }}
   </button>
   <!-- El botón Cancelar llama a toggleEditMode para salir de la edición sin guardar -->
   <button type="button" class="btn-cancelar" (click)="toggleEditMode()">Cancelar</button>
  </div>
 </form>

 <!-- ============================================= -->
 <!-- MODO VISTA (No editable) -->
 <!-- ============================================= -->
 <div *ngIf="!isEditing" class="display-data">
  
  
  <div class="display-group">
   <span class="label">Nombre Completo:</span>
   <span class="value">{{ profesionalData.name }} {{ profesionalData.lastname }}</span>
  </div>

  <div class="display-group">
   <span class="label">Email:</span>
   <span class="value">{{ profesionalData.email }}</span>
  </div>

  <div class="display-group">
   <span class="label">Teléfono:</span>
   <span class="value">{{ profesionalData.phone }}</span>
  </div>
  
  <div class="display-group">
   <span class="label">DNI:</span>
   <span class="value">{{ profesionalData.dni }}</span>
  </div>
  
  <div class="display-group">
   <span class="label">Licencia:</span>
   <span class="value">{{ profesionalData.license }}</span>
  </div>

  <button type="button" class="btn-editar" (click)="toggleEditMode()">✏️ Editar Perfil</button>
 </div>
</div>
